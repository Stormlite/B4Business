name: Daily Prediction and Retraining Pipeline

on:
  schedule:
    - cron: '13 0 * * *' # 00:13 UTC — off the exact-hour mark (GitHub's own
                          # docs flag :00 as the most congested minute for
                          # scheduled runs, which is very likely why this was
                          # consistently starting ~3h late at ~04:00-04:53 UTC
                          # every day despite being set for 01:00).
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write   # needed by the existing Commit and Push Changes step
  actions: write    # needed to trigger v2's workflow_dispatch below

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Forces Git to download full branch history to make rebasing successful

      - name: Trigger v2 Pipeline
        # v2 is not the default branch, so its own schedule trigger never
        # fires on its own — GitHub Actions only evaluates cron schedules
        # from the default branch's copy of the workflow file (confirmed:
        # every scheduled run in this repo's history has targeted master,
        # zero ever targeted v2, despite v2 having its own valid schedule
        # trigger). This step dispatches v2's pipeline remotely instead,
        # right after checkout so it starts as close to the 00:13 UTC
        # target as possible rather than waiting for master's own pipeline
        # (fetch/train/backtest/notify) to finish first.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily_pipeline.yml/dispatches" \
            -d '{"ref":"v2"}'

      - name: Wait for v2's API-Football Window to Clear
        # API-Football free tier: 10 requests/minute AND 100 requests/day,
        # both hard limits, shared across master and v2 since they use the
        # same key. v2's own run makes 2 fetch calls (today + tomorrow) then
        # up to 40 backfill calls at 8s spacing (~320s worst case) — all in
        # the first two steps of its run, back to back. Without this delay,
        # master's own fetch call below could land inside that same 60s
        # window and push the combined rate over 10/min. 360s covers v2's
        # worst-case API window plus buffer for its own runner startup
        # latency (GitHub Actions runners can take 20-60s just to queue).
        run: sleep 360

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Today's Matches & Update DB
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }} # 🌟 Securely linked odds aggregation key
        run: |
          python -m data.collector --fetch-today

      - name: Retrain Model Automatically
        run: |
          python -m models.train --train

      - name: Run Historical Backtest Evaluation Check
        run: |
          python scripts/backtest.py

      - name: Dispatch High-Value WhatsApp Alerts to Phone
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TARGET_WHATSAPP_NUMBER: ${{ secrets.TARGET_WHATSAPP_NUMBER }}
          TWILIO_CUSTOM_CONTENT_SID: ${{ secrets.TWILIO_CUSTOM_CONTENT_SID }}
          TWILIO_SANDBOX_TEMPLATE_SID: ${{ secrets.TWILIO_SANDBOX_TEMPLATE_SID }}
        run: |
          python scripts/notify.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force tracking all artifacts and model binaries
          git add data/matches.duckdb models/over25_model.joblib models/btts_model.joblib models/outcome_model.joblib
          
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Automated Daily Update: Multi-Market Predictive Engines [skip ci]"
            
            # Rebase clean to prevent conflict rejections
            git pull origin master --rebase -X theirs
            
            git push origin master
          else
            echo "ℹ️ No adjustments or profile updates detected across database files. Skipping commit node."
          fi
